name: Deploy Firebase backend

# Deploys Firestore/Storage rules, indexes and Cloud Functions to Firebase (project selah-studio-hnxp).
# Runs on every push to main that touches the backend, or manually from the
# Actions tab ("Run workflow").
#
# Required repository secret:
#   FIREBASE_SERVICE_ACCOUNT  – JSON key of a service account in the Firebase project
# Optional repository secrets (set to the real keys when you have them):
#   DEEPGRAM_API_KEY, ANTHROPIC_API_KEY  – default to "unset" (integration shown as not configured)
# Optional repository variable:
#   FIREBASE_PROJECT_ID – defaults to the project in .firebaserc

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - "cors.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Check service account secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Settings → Secrets and variables → Actions). See README → Deploying the backend."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install
        run: |
          npm install -g firebase-tools@14
          npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

      - name: Resolve project
        id: project
        run: |
          P="${{ vars.FIREBASE_PROJECT_ID }}"
          if [ -z "$P" ]; then P=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.default)"); fi
          echo "id=$P" >> "$GITHUB_OUTPUT"
          echo "Deploying to Firebase project: $P"

      - name: Enable required Google APIs
        run: |
          gcloud services enable \
            cloudbilling.googleapis.com cloudresourcemanager.googleapis.com \
            cloudfunctions.googleapis.com run.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com eventarc.googleapis.com cloudtasks.googleapis.com \
            secretmanager.googleapis.com iam.googleapis.com \
            --project "${{ steps.project.outputs.id }}"

      - name: Set function secrets
        env:
          DEEPGRAM: ${{ secrets.DEEPGRAM_API_KEY }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          umask 077
          printf '%s' "${DEEPGRAM:-unset}" > /tmp/deepgram
          printf '%s' "${ANTHROPIC:-unset}" > /tmp/anthropic
          firebase functions:secrets:set DEEPGRAM_API_KEY --data-file /tmp/deepgram --project "${{ steps.project.outputs.id }}" --non-interactive --force
          firebase functions:secrets:set ANTHROPIC_API_KEY --data-file /tmp/anthropic --project "${{ steps.project.outputs.id }}" --non-interactive --force
          rm -f /tmp/deepgram /tmp/anthropic

      - name: Deploy rules, indexes and functions
        run: |
          # First deploys to a new project can hit transient Google errors
          # (e.g. 409 creating the gcf-v2-sources bucket), so retry once.
          for attempt in 1 2; do
            if firebase deploy --only firestore,storage,functions --project "${{ steps.project.outputs.id }}" --non-interactive --force 2>&1 | tee deploy.out; then
              if ! grep -qE "failed to (create|update) function|Functions deploy had errors" deploy.out; then exit 0; fi
            fi
            echo "Deploy attempt $attempt had errors; retrying in 30s…"; sleep 30
          done
          exit 1

      - name: Let Storage rules read Firestore (church membership checks)
        run: |
          N=$(gcloud projects describe "${{ steps.project.outputs.id }}" --format='value(projectNumber)')
          gcloud beta services identity create --service=firebasestorage.googleapis.com --project "${{ steps.project.outputs.id }}" >/dev/null 2>&1 || true
          gcloud projects add-iam-policy-binding "${{ steps.project.outputs.id }}" \
            --member="serviceAccount:service-$N@gcp-sa-firebasestorage.iam.gserviceaccount.com" \
            --role="roles/firebaserules.firestoreServiceAgent" --condition=None --quiet >/dev/null \
            && echo "Granted Storage → Firestore access" \
            || echo "::warning::Could not grant Storage access to Firestore. In Google Cloud IAM, give service-$N@gcp-sa-firebasestorage.iam.gserviceaccount.com the role 'Firebase Rules Firestore Service Agent'."

      - name: Allow graphic export from Storage (CORS)
        run: |
          B="${{ vars.FIREBASE_STORAGE_BUCKET }}"
          if [ -z "$B" ]; then B="${{ steps.project.outputs.id }}.firebasestorage.app"; fi
          gcloud storage buckets update "gs://$B" --cors-file=cors.json --project "${{ steps.project.outputs.id }}" \
            || echo "::warning::Could not set CORS on gs://$B — set the FIREBASE_STORAGE_BUCKET variable to your bucket name."

      - name: Create feature flags (first deploy only — never overwrites)
        run: |
          T=$(gcloud auth print-access-token)
          URL="https://firestore.googleapis.com/v1/projects/${{ steps.project.outputs.id }}/databases/(default)/documents/config?documentId=flags"
          CODE=$(curl -s -o /tmp/flags.json -w '%{http_code}' -X POST "$URL" -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"fields":{"photoEditor":{"booleanValue":true}}}')
          if [ "$CODE" = "200" ]; then echo "Created config/flags (photoEditor: on)";
          elif [ "$CODE" = "409" ]; then echo "config/flags already exists — left unchanged";
          else echo "::warning::Could not create config/flags (HTTP $CODE)"; cat /tmp/flags.json; fi

      - name: Add new feature flags (only ones not already set)
        run: |
          T=$(gcloud auth print-access-token)
          DOC="https://firestore.googleapis.com/v1/projects/${{ steps.project.outputs.id }}/databases/(default)/documents/config/flags"
          CUR=$(curl -s "$DOC" -H "Authorization: Bearer $T")
          for F in videoStyles; do
            if echo "$CUR" | grep -q "\"$F\""; then echo "$F already set — left unchanged"; continue; fi
            curl -s -o /dev/null -w "$F → %{http_code}\n" -X PATCH "$DOC?updateMask.fieldPaths=$F" -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
              -d "{\"fields\":{\"$F\":{\"booleanValue\":true}}}"
          done
